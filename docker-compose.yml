services:
  hmka-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hmka-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MODEL_DEVICE: cpu
      MODEL_USE_FP16: "false"
      HF_HOME: /app/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ./data:/app/data
      - hmka-model-cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  hmka-model-cache:
